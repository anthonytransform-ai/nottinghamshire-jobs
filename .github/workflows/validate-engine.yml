name: Validate weekly update engine

on:
  pull_request:
    branches:
      - main
    paths:
      - job_update/**
      - config/**
      - scripts/**
      - tests/**
      - requirements-job-update.txt

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile engine
        run: python -m compileall -q job_update scripts

      - name: Check registry and local readiness
        run: |
          python -m job_update sources
          python -m job_update doctor

      - name: Run fixture suite
        run: python -m unittest discover -s tests -v

      - name: Run structured-ingestion CLI smoke test
        run: |
          python -m job_update --registry tests/fixtures/agent_registry.toml ingest --date 2026-09-15 --input tests/fixtures/agent_source_results.json
          python -m job_update --registry tests/fixtures/agent_registry.toml build --date 2026-09-15
