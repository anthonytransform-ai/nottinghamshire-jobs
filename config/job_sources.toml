# Agent-facing source registry derived from Job_Search_Playbook_2026-09-14_Final.md.
#
# Every mandatory source is researched afresh by Codex. The registry records
# current discovery knowledge and completeness evidence to collect; it does
# not require a bespoke HTML parser. Only the Oracle public API is retained as
# a stable collector.

[[sources]]
source_id = "ncc-tal"
display_name = "Nottinghamshire County Council — TAL NCC Vacancies"
employer_type = "Council"
mandatory = true
official_entry_url = "https://www.nottinghamshire.gov.uk/jobs-and-working/working-for-us/opportunities-with-us"
source_type = "agent-researched"
playbook_notes = "Follow the official link to the current TAL NCC Vacancies board; distinguish NCC Vacancies from All Vacancies and record anti-bot or indexed official evidence."
expected_host_service = "Nottinghamshire County Council"
completeness_evidence = "All current NCC board pages or an explicit current total, with TAL opportunity IDs."

[[sources]]
source_id = "nottingham-city-oracle"
display_name = "Nottingham City Council — Oracle HCM"
employer_type = "Council"
mandatory = true
official_entry_url = "https://eism.fa.em2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/ncc/jobs"
source_type = "stable-api"
collector = "oracle_hcm"
stable_data_route = "https://eism.fa.em2.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitions?onlyData=true&expand=requisitionList&finder=findReqs;siteNumber=CX_1,limit=100,offset=0"
playbook_notes = "Use the public recruitingCEJobRequisitions endpoint, paginate by offset, verify TotalJobsCount and each current requisition."
expected_host_service = "Nottingham City Council"
completeness_evidence = "Oracle TotalJobsCount equals the unique public requisition IDs captured."
configuration = { api_url = "https://eism.fa.em2.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitions?onlyData=true&expand=requisitionList&finder=findReqs;siteNumber=CX_1,limit=100,offset=0", detail_url_template = "https://eism.fa.em2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/ncc/job/{id}", site_number = "CX_1", page_size = 100, organization = "Nottingham City Council" }

